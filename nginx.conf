server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte a SPA (React Router): redireciona rotas desconhecidas para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets com hash (gerados pelo Vite: js, css, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desabilita cache do index.html para garantir que o usuário sempre receba a versão mais recente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
