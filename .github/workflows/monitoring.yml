name: Monitoramento

# Verifica a cada 15 minutos se a aplicação publicada responde. Roda para homologação e
# produção; cada ambiente usa a sua variável APP_BASE_URL. Falha quando a página não responde,
# o que notifica os responsáveis. Detalhes em docs/CICD.md.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Verificar ${{ matrix.ambiente }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ambiente: [homologacao, producao]
    environment: ${{ matrix.ambiente }}
    steps:
      - name: Verificar a aplicação publicada
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::APP_BASE_URL não está definida no ambiente ${{ matrix.ambiente }}: verificação ignorada."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output /dev/null "${BASE_URL%/}/"
          echo "Aplicação respondendo em ${BASE_URL%/}/."
